name: Evidence Verification

on:
  push:
    paths:
      - "EVIDENCE/**"
  pull_request:
    paths:
      - "EVIDENCE/**"

jobs:
  verify-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required directories
        run: |
          test -d EVIDENCE/GCP || exit 1
          test -d EVIDENCE/GCP/ASSESSMENTS || exit 1

      - name: Verify SHA-256 hashes
        run: |
          find EVIDENCE -name "SHA256SUMS.txt" -print -exec shasum -a 256 -c {} \;

      - name: Evidence verification completed
        run: echo "Evidence integrity and structure verified."
