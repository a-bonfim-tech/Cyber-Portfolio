name: Certificates Integrity CI

on:
  push:
    paths:
      - "certificates/**"
      - "badges/**"
      - ".github/workflows/certificates-integrity.yml"
  pull_request:
    paths:
      - "certificates/**"
      - "badges/**"
      - ".github/workflows/certificates-integrity.yml"

jobs:
  validate-certificates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate certificates manifest
        run: |
          set -euo pipefail
          echo "Validando integridade de certificados e badges…"
          test -d certificates
          test -d badges
          echo "OK"

  guardrail-no-audit-scratch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Guardrail — forbid audit scratch files
        run: .github/scripts/guardrail_no_audit_scratch.sh
